- name: Create the secrets directory
  ansible.builtin.file:
    path: "{{ secrets_dir }}"
    state: directory
    mode: "0700"
  run_once: true
  delegate_to: localhost
  become: false

- name: Generate passwords once
  ansible.builtin.set_fact:
    generated_secrets:
      - "{{ pg_superuser_password | length }}"
      - "{{ pg_replication_password | length }}"
      - "{{ pg_app_password | length }}"
      - "{{ patroni_restapi_password | length }}"
      - "{{ etcd_cluster_token | length }}"
      - "{{ pgbackrest_cipher_pass | length }}"
  run_once: true
  delegate_to: localhost
  no_log: true
