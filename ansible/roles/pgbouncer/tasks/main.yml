- name: Install PgBouncer
  ansible.builtin.apt:
    name: pgbouncer
    state: present

- name: Read password verifiers from the leader
  community.postgresql.postgresql_query:
    login_db: postgres
    login_unix_socket: "{{ pg_socket_dir }}"
    query: >-
      SELECT rolname, rolpassword FROM pg_authid
      WHERE rolname = ANY(string_to_array(%s, ',')) AND rolpassword IS NOT NULL
      ORDER BY rolname
    positional_args:
      - "{{ pgbouncer_users | join(',') }}"
  become: true
  become_user: postgres
  run_once: true
  delegate_to: "{{ patroni_leader }}"
  register: pgbouncer_verifiers
  changed_when: false
  no_log: true

- name: Write the PgBouncer user list
  ansible.builtin.template:
    src: userlist.txt.j2
    dest: /etc/pgbouncer/userlist.txt
    owner: postgres
    group: postgres
    mode: "0600"
  no_log: true
  notify: Reload pgbouncer

- name: Configure PgBouncer
  ansible.builtin.template:
    src: pgbouncer.ini.j2
    dest: /etc/pgbouncer/pgbouncer.ini
    owner: postgres
    group: postgres
    mode: "0640"
  notify: Reload pgbouncer

- name: Create the PgBouncer service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/pgbouncer.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Restart PgBouncer whenever it dies
  ansible.builtin.copy:
    dest: /etc/systemd/system/pgbouncer.service.d/10-restart.conf
    content: |
      [Unit]
      StartLimitIntervalSec=0

      [Service]
      Restart=always
      RestartSec=2
      LimitNOFILE=65536
    owner: root
    group: root
    mode: "0644"
  notify: Restart pgbouncer

- name: Install the role reconciler
  ansible.builtin.copy:
    src: pg-role-apply
    dest: /usr/local/bin/pg-role-apply
    owner: root
    group: root
    mode: "0755"

- name: Install the role watcher units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - pg-role-watch.path
    - pg-role-watch.service

- name: Start PgBouncer
  ansible.builtin.systemd_service:
    name: pgbouncer
    state: started
    enabled: true
    daemon_reload: true

- name: Watch Patroni role changes
  ansible.builtin.systemd_service:
    name: pg-role-watch.path
    state: started
    enabled: true
