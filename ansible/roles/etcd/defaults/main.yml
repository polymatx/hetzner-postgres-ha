etcd_version: "3.6.15"
etcd_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts.architecture] }}"
etcd_release: "etcd-v{{ etcd_version }}-linux-{{ etcd_arch }}"
etcd_download_base: "https://github.com/etcd-io/etcd/releases/download/v{{ etcd_version }}"
etcd_install_dir: /opt/etcd
etcd_data_dir: /var/lib/etcd
etcd_client_port: 2379
etcd_peer_port: 2380
etcd_auto_compaction_retention: "1"
etcd_log_level: warn
