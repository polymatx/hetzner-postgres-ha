- name: Check for the OpenSSH server
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config.d
  register: hardening_sshd_dir

- name: Harden the SSH server
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      PermitEmptyPasswords no
      X11Forwarding no
      AllowAgentForwarding no
      MaxAuthTries 3
      LoginGraceTime 30
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  when: hardening_ssh and hardening_sshd_dir.stat.exists
  notify: Reload ssh

- name: Tune kernel settings
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/60-postgres-ha.conf
    reload: true
  loop: "{{ hardening_sysctl_settings | dict2items }}"
  when: hardening_sysctl

- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present
  when: hardening_ufw

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
  when: hardening_ufw

- name: Allow cluster ports from the private network
  community.general.ufw:
    rule: allow
    src: "{{ cluster_cidr }}"
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ hardening_cluster_ports }}"
  when: hardening_ufw

- name: Deny everything else and enable the firewall
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
  when: hardening_ufw
