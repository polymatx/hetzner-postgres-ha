global
  maxconn 2000

defaults
  mode tcp
  timeout connect 2s
  timeout client 30m
  timeout server 30m
  timeout check 2s
  default-server inter 3s fall 2 rise 1

listen postgres
  bind :5432
  option httpchk
  http-check send meth GET uri /primary
  http-check expect status 200
  server pg-ha-1 10.77.0.21:5432 check port 8008
  server pg-ha-2 10.77.0.22:5432 check port 8008
  server pg-ha-3 10.77.0.23:5432 check port 8008

listen pgbouncer
  bind :6432
  option httpchk
  http-check send meth GET uri /primary
  http-check expect status 200
  server pg-ha-1 10.77.0.21:6432 check port 8008
  server pg-ha-2 10.77.0.22:6432 check port 8008
  server pg-ha-3 10.77.0.23:6432 check port 8008

listen replicas
  bind :5433
  balance roundrobin
  option httpchk
  http-check send meth GET uri /replica
  http-check expect status 200
  server pg-ha-1 10.77.0.21:5432 check port 8008
  server pg-ha-2 10.77.0.22:5432 check port 8008
  server pg-ha-3 10.77.0.23:5432 check port 8008
